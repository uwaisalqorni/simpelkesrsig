<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#064E3B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle with Shadow -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Top Highlight -->
  <rect x="10" y="10" width="108" height="54" rx="26" fill="url(#glowGrad)" opacity="0.4" />

  <!-- Inner Medical Cross (Clean, Rounded) -->
  <g fill="#FFFFFF">
    <!-- Vertical bar -->
    <rect x="50" y="26" width="28" height="76" rx="8" />
    <!-- Horizontal bar -->
    <rect x="26" y="50" width="76" height="28" rx="8" />
  </g>

  <!-- Center Circle Accent -->
  <circle cx="64" cy="64" r="14" fill="#047857" />

  <!-- Heartbeat / Electro Pulse Line across the cross (IPSRS & Medical Symbol) -->
  <path d="M 28 64 L 46 64 L 54 48 L 62 80 L 68 56 L 74 68 L 80 64 L 100 64" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Small Engineering Hex Dot -->
  <circle cx="64" cy="64" r="3.5" fill="#FFFFFF" />
</svg>
